services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiplens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shiplens}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  # Local mail capture only: docker compose --profile local up -d database mailpit
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ['local']
    ports:
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiplens}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-shiplens}
    depends_on:
      database:
        condition: service_healthy
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiplens}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-shiplens}
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
volumes:
  postgres-data:
  mailpit-data:
